name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build staging debug APK
        id: gradle-build
        continue-on-error: true
        run: ./gradlew assembleStagingDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log
      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: gradle-build.log
      - name: Fail if Gradle build failed
        if: steps.gradle-build.outcome == 'failure'
        run: exit 1
      - name: Locate APK
        run: |
          find app/build/outputs -type f -name '*.apk' -print
          test -n "$(find app/build/outputs -type f -name '*.apk' -print -quit)"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopipos-staging-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: KopiPOS Native v0.1.0 build ${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
